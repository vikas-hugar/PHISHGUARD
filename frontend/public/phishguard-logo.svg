<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="hookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4040"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a0a"/>
      <stop offset="100%" stop-color="#0d0505"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Shield base -->
  <path d="M24 3L6 10v12c0 10.5 7.6 20.3 18 22.8C34.4 42.3 42 32.5 42 22V10L24 3z"
        fill="url(#shieldGrad)" stroke="url(#hookGrad)" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Shield inner subtle glow border -->
  <path d="M24 6.5L9 12.5v9.5c0 9 6.5 17.3 15 19.5C33.5 39.3 39 31 39 22v-9.5L24 6.5z"
        fill="none" stroke="rgba(239,68,68,0.15)" stroke-width="0.8"/>

  <!-- Hook body — vertical stem -->
  <path d="M24 13 L24 28" stroke="url(#hookGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Hook curve at bottom — smooth J curve -->
  <path d="M24 28 C24 33, 18 35, 18 31 C18 28.5, 20.5 27.5, 22 29"
        stroke="url(#hookGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- Hook tip barb -->
  <path d="M22 29 L19.5 27" stroke="url(#hookGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Eye ring at top of hook -->
  <circle cx="24" cy="12" r="2.2" stroke="url(#hookGrad)" stroke-width="2" fill="none" filter="url(#glow)"/>

  <!-- Subtle red inner shine -->
  <circle cx="24" cy="12" r="0.8" fill="#FF4040" opacity="0.9"/>
</svg>
