<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <!--
    PhishGuard Logo
    Fish body forming letter "P" + fishing hook below
    Black monochrome, premium minimal
  -->

  <!-- ═══════════════════════════════════════════
       FISH SILHOUETTE forming the letter P
       The fish swims in a P-shape path:
         tail (upper-left) → back → top-right arc → bowl loop → head (left-facing)
  ═══════════════════════════════════════════ -->
  <path
    fill="#0f0f0f"
    d="
      M 52 115
      C 38 108, 28 92, 28 76
      C 28 54, 44 36, 66 28
      C 82 22, 100 20, 116 26
      C 140 34, 158 56, 156 80
      C 154 104, 136 120, 112 126
      C 96 130, 78 128, 66 122
      C 62 120, 58 120, 56 126
      C 54 134, 56 146, 50 152
      C 46 156, 38 156, 34 152
      C 30 148, 30 140, 34 136
      C 38 132, 44 134, 44 140
      C 44 144, 40 148, 38 148
      C 42 142, 44 134, 46 126
      C 48 118, 50 114, 56 112
      L 52 115
      Z
    "
  />

  <!-- Tail fins — two forked prongs upper-left -->
  <path
    fill="#0f0f0f"
    d="
      M 52 115
      C 44 102, 24 94, 8 80
      C 10 76, 18 76, 26 82
      C 34 88, 44 98, 52 112
      Z
    "
  />
  <path
    fill="#0f0f0f"
    d="
      M 52 112
      C 40 94, 22 74, 10 56
      C 14 54, 22 58, 30 68
      C 38 78, 46 96, 52 112
      Z
    "
  />

  <!-- Dorsal fin (top of fish, slight bump) -->
  <path
    fill="#0f0f0f"
    d="
      M 90 22
      C 94 8, 114 4, 124 16
      C 118 20, 108 22, 96 22
      Z
    "
  />

  <!-- Eye — white sclera + black pupil -->
  <circle cx="48" cy="80" r="9" fill="white"/>
  <circle cx="50" cy="80" r="4.5" fill="#0f0f0f"/>

  <!-- ═══════════════════════════════
       HOOK below the P belly
  ═══════════════════════════════ -->

  <!-- Hook stem (vertical) -->
  <line
    x1="76" y1="128" x2="76" y2="178"
    stroke="#0f0f0f" stroke-width="8" stroke-linecap="round"
  />

  <!-- Hook J-curve -->
  <path
    d="M 76 178 C 76 200, 50 206, 46 192 C 44 182, 54 174, 62 180"
    stroke="#0f0f0f" stroke-width="8"
    stroke-linecap="round" stroke-linejoin="round"
    fill="none"
  />

  <!-- Barb -->
  <path
    d="M 62 180 L 50 170"
    stroke="#0f0f0f" stroke-width="6"
    stroke-linecap="round"
  />

  <!-- Hook eye / ring -->
  <circle
    cx="76" cy="122"
    r="6"
    stroke="#0f0f0f" stroke-width="5.5"
    fill="white"
  />
</svg>
